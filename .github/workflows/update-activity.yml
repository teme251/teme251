name: Refresh public project activity

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-activity.yml"
      - "scripts/update_activity.py"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh allowlisted public activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py
      - name: Commit changed README
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh public project activity"
          git push
